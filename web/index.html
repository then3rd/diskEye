<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>diskeye</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%232a78d6'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span>diskeye</div>
  <nav class="tabs" role="tablist">
    <a href="#" data-tab="overview" role="tab">Overview</a>
    <a href="#" data-tab="physical" role="tab">Physical</a>
    <a href="#" data-tab="files" role="tab">Files</a>
    <a href="#" data-tab="workloads" role="tab">Workloads</a>
    <a href="#" data-tab="reclaim" role="tab">Reclaim</a>
    <a href="#" data-tab="diff" role="tab">Diff</a>
  </nav>
  <div class="meta" id="meta"></div>
</header>
<div id="banners"></div>
<main>
  <section id="view-overview" class="view"></section>
  <section id="view-physical" class="view"></section>
  <section id="view-files" class="view">
    <div class="toolbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <form id="goto" class="goto"><input id="goto-input" type="text" placeholder="Go to path… /var/lib" spellcheck="false" aria-label="Go to path"></form>
      <label class="ctl">Size <select id="metric">
        <option value="alloc">disk usage</option><option value="apparent">apparent size</option><option value="items">item count</option>
      </select></label>
      <label class="ctl">Color <select id="colorby">
        <option value="owner">by owner</option><option value="folder">by top folder</option><option value="kind">by type</option>
      </select></label>
      <div class="seg" id="chartkind" role="group" aria-label="Chart type">
        <button data-kind="treemap" class="on">Treemap</button><button data-kind="sunburst">Sunburst</button>
      </div>
    </div>
    <div class="files-grid">
      <div class="card chart-card">
        <div id="files-chart" class="files-chart"></div>
        <div id="files-legend" class="legend"></div>
      </div>
      <div class="card side">
        <div id="files-info"></div>
        <div id="files-table"></div>
      </div>
    </div>
  </section>
  <section id="view-workloads" class="view"></section>
  <section id="view-reclaim" class="view"></section>
  <section id="view-diff" class="view"></section>
</main>
<div id="tooltip" class="tooltip" role="tooltip" hidden></div>
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div id="modal-body"></div>
  </div>
</div>
<script src="vendor/d3.min.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
