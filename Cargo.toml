[package]
name = "diskeye"
version = "0.1.0"
edition = "2024"
description = "A god's-eye view of what uses disk space on a Linux system"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
globset = "0.4.20"
humansize = "2.1.3"
libc = "0.2.190"
postcard = { version = "1.1.3", features = ["use-std"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
ratatui = { version = "0.30.2", optional = true }
rayon = "1.12.0"
rust-embed = { version = "8.12.0", optional = true }
rustix = { version = "1.1.5", features = ["fs", "process", "mount", "thread", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"], optional = true }
toml = "1.1.6"
zstd = "0.14.0"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

[features]
default = ["tui", "web"]
tui = ["dep:ratatui", "dep:crossterm"]
web = ["dep:axum", "dep:tokio", "dep:rust-embed"]

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
